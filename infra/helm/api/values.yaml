# DRAFT — review every line before applying.

replicaCount: 1

image:
  repository: gagost/bootcamp-api
  tag: "1.0.0"           # Never "latest" — you need reproducible deploys
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  nodePort: 30082

# Without requests, the scheduler has no data and kubelet evicts under pressure.
# t3.micro has ~1 GB RAM — be conservative.
resources:
  requests:
    cpu: 50m        # 50 millicores = 0.05 of one CPU
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

# Name of the Kubernetes Secret that holds DATABASE_URL.
# The Secret is created outside the chart so no credential ever lives in git.
database:
  urlSecretName: api-db

env:
  PORT: "8080"
