replicaCount: 1

image:
  repository: gagost/bootcamp-api
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  type: NodePort
  port: 8080
  nodePort: 30082

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

database:
  urlSecretName: api-db

env:
  PORT: "8080"

metrics:
  enabled: true
