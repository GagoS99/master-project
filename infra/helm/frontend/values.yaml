# DRAFT — review every line before applying.

replicaCount: 1

image:
  repository: gagost/bootcamp-frontend
  tag: "1.0.0"
  pullPolicy: IfNotPresent

service:
  # NodePort so you can open http://<ec2-ip>:<nodePort> from your laptop
  type: NodePort
  port: 80
  nodePort: 30081   # must be 30000-32767; add an inbound rule in the EC2 SG in Terraform

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

env:
  apiUrl: "/api"   # relative — nginx proxies /api to the backend; avoids CORS entirely

# nginx proxy target — must match the api Service name and port
api:
  serviceName: api-api
  servicePort: 8080
