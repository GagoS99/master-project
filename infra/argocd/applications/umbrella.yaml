apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: umbrella
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:GagoS99/master-project.git
    targetRevision: main
    path: infra/helm/umbrella
    helm:
      valueFiles:
        - values.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: bootcamp
  syncPolicy:
    automated:
      selfHeal: true   # DRAFT — reverts manual kubectl changes automatically
      # prune: true    # left commented — only enable after stable; deletes resources removed from Git
    syncOptions:
      - CreateNamespace=true
