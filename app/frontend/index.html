<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Bootcamp Items</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
    input, button { font: inherit; padding: 0.5rem; }
    ul { padding: 0; list-style: none; }
    li { padding: 0.5rem 0; border-bottom: 1px solid #eee; }
    .meta { color: #888; font-size: 0.85em; }
    .err { color: #c00; }
  </style>
</head>
<body>
  <h1>Items</h1>
  <form id="f">
    <input id="name" placeholder="Item name" required />
    <button>Add</button>
  </form>
  <p id="err" class="err"></p>
  <ul id="list"></ul>
  <script>
    const API = window.__API_URL__ || '/api';
    const list = document.getElementById('list');
    const err = document.getElementById('err');
    async function load() {
      err.textContent = '';
      try {
        const r = await fetch(API + '/items');
        if (!r.ok) throw new Error('GET /items failed: ' + r.status);
        const items = await r.json();
        list.innerHTML = items.map(i => `<li>${i.name}<div class="meta">#${i.id} · ${i.created_at}</div></li>`).join('');
      } catch (e) { err.textContent = e.message; }
    }
    document.getElementById('f').addEventListener('submit', async (e) => {
      e.preventDefault();
      err.textContent = '';
      const name = document.getElementById('name').value;
      try {
        const r = await fetch(API + '/items', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ name }),
        });
        if (!r.ok) throw new Error('POST /items failed: ' + r.status);
        document.getElementById('name').value = '';
        load();
      } catch (e) { err.textContent = e.message; }
    });
    load();
  </script>
</body>
</html>
